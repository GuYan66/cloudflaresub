name = "cloudflaresub"
main = "src/worker.js"
compatibility_date = "2026-03-06"
workers_dev = true

routes = [
  { pattern = "sub.guyan1208.top", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/sub/*"]

[[kv_namespaces]]
binding = "SUB_STORE"
id = "fa3764d0c74640b8aabf67faa1c85f95"
